<!doctype html><html><head><meta charset="utf-8"><style>
@font-face { font-family: 'TT Travels Next'; src: url('../../assets/fonts/TTTravelsNext-Variable.woff2') format('woff2'); font-weight: 100 900; }
body{margin:0;background:#08080A;color:#fff;font-family:system-ui;padding:36px;display:flex;flex-direction:column;gap:30px}
h2{margin:0;font:600 14px system-ui;color:#02FFE0;letter-spacing:.1em;text-transform:uppercase}
.row{display:flex;align-items:center;gap:36px;flex-wrap:wrap}
.lock{display:inline-flex;align-items:center;gap:.45em;font-family:'TT Travels Next';font-weight:600;letter-spacing:-.01em}
.lock svg{height:1.25em;width:auto}
.lock span{color:#02FFE0}
.cy{background:#02FFE0;color:#000;padding:16px 20px;border-radius:18px;--logo-accent:#000}
.cy .lock span{color:#000}
.fav{width:56px;height:56px;border-radius:13px;background:#0B0B0E;display:flex;align-items:center;justify-content:center;color:#fff}
.fav svg{width:40px}
</style></head><body>
<script>
const A = 'var(--logo-accent,#02FFE0)';

/* квадратный модуль: внешние углы r=3.5, внутренний угол вырезан кругом ядра r=10 */
const sq = (g, r) => { const o = 4, i = 32 - g / 2, cut = Math.sqrt(r*r - (g/2)*(g/2)); const y = (32 - cut).toFixed(2);
  return `M${o+r0},${o}H${i-r0}Q${i},${o} ${i},${o+r0}V${y}A${r} ${r} 0 0 0 ${y} ${i}H${o+r0}Q${o},${i} ${o},${i-r0}V${o+r0}Q${o},${o} ${o+r0},${o}Z`; };
const r0 = 3.5;
const core2 = (g, r, dot, pop) => `<svg viewBox="0 0 64 64" aria-hidden="true"><g transform="translate(32 32) rotate(45) scale(.74) translate(-32 -32)">` +
  [0,90,180,270].map((rot, k) => `<path d="${sq(g, r)}" fill="currentColor" transform="rotate(${rot} 32 32)${pop && k===1 ? ' translate(-3.2 -3.2)' : ''}"/>`).join('') +
  `</g><circle cx="32" cy="32" r="${dot}" fill="${A}"/></svg>`;
const V = { 'Ядро · строгое': core2(6, 11, 5, false), 'Ядро · модуль выдвинут': core2(6, 11, 5, true), 'Ядро · тонкие зазоры': core2(4, 9, 4.2, false) };
let h = '';
for (const [name, m] of Object.entries(V)) {
  const lock = fs => `<div class="lock" style="font-size:${fs}px">${m}Sprinter <span>4×4</span></div>`;
  h += `<h2>${name}</h2><div class="row">${lock(16)}${lock(28)}${lock(56)}<div class="cy">${lock(24)}</div><div class="fav">${m}</div>` +
       [16,24,40].map(s => `<div style="width:${s}px;color:#fff">${m}</div>`).join('') + `</div>`;
}
document.body.innerHTML = h;
</script></body></html>
