<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns%3D%22http%3A//www.w3.org/2000/svg%22%20viewBox%3D%220%200%2064%2064%22%3E%3Crect%20width%3D%2264%22%20height%3D%2264%22%20rx%3D%2214%22%20fill%3D%22%230B0B0E%22/%3E%3Cg%20transform%3D%22translate%2832%2032%29%20scale%28.86%29%20translate%28-32%20-32%29%22%3E%3Cg%20transform%3D%22translate%2832%2032%29%20rotate%2845%29%20scale%28.74%29%20translate%28-32%20-32%29%22%3E%3Cpath%20d%3D%22M12%204H21Q29%204%2029%2012V21.42A11%2011%200%200%200%2021.42%2029H12Q4%2029%204%2021V12Q4%204%2012%204Z%22%20fill%3D%22%23FFFFFF%22%20transform%3D%22rotate%280%2032%2032%29%22/%3E%3Cpath%20d%3D%22M12%204H21Q29%204%2029%2012V21.42A11%2011%200%200%200%2021.42%2029H12Q4%2029%204%2021V12Q4%204%2012%204Z%22%20fill%3D%22%23FFFFFF%22%20transform%3D%22rotate%2890%2032%2032%29%22/%3E%3Cpath%20d%3D%22M12%204H21Q29%204%2029%2012V21.42A11%2011%200%200%200%2021.42%2029H12Q4%2029%204%2021V12Q4%204%2012%204Z%22%20fill%3D%22%23FFFFFF%22%20transform%3D%22rotate%28180%2032%2032%29%22/%3E%3Cpath%20d%3D%22M12%204H21Q29%204%2029%2012V21.42A11%2011%200%200%200%2021.42%2029H12Q4%2029%204%2021V12Q4%204%2012%204Z%22%20fill%3D%22%23FFFFFF%22%20transform%3D%22rotate%28270%2032%2032%29%22/%3E%3C/g%3E%3Ccircle%20cx%3D%2232%22%20cy%3D%2232%22%20r%3D%225%22%20fill%3D%22%2302FFE0%22/%3E%3C/g%3E%3C/svg%3E">
<style>
/* Тёмная монотема: угольная подложка, один оранжевый акцент, шкала скруглений 4-999. */
:root {
  color-scheme: dark;
  --ground: #08080A;
  --panel: #0E0E12;
  --row: #15151A;
  --card: #16161B;
  --control: #26262C;
  --accent: #02FFE0;
  --ink-on-accent: #000000;
  --text: #FFFFFF;
  --text-2: rgba(255, 255, 255, 0.68);
  --text-3: rgba(255, 255, 255, 0.5);
}
@font-face { font-family: 'Rooftop'; src: url('assets/fonts/rooftop/Rooftop-Regular.otf') format('opentype'); font-weight: 400; font-style: normal; font-display: swap; }
@font-face { font-family: 'Rooftop'; src: url('assets/fonts/rooftop/Rooftop-Book.otf') format('opentype'); font-weight: 450; font-style: normal; font-display: swap; }
@font-face { font-family: 'Rooftop'; src: url('assets/fonts/rooftop/Rooftop-Medium.otf') format('opentype'); font-weight: 500; font-style: normal; font-display: swap; }
@font-face { font-family: 'Rooftop'; src: url('assets/fonts/rooftop/Rooftop-Bold.otf') format('opentype'); font-weight: 700; font-style: normal; font-display: swap; }
@font-face { font-family: 'TT Travels Next'; src: url('assets/fonts/TTTravelsNext-Variable.woff2') format('woff2'); font-weight: 100 900; font-style: normal; font-display: swap; }
body { margin: 0; background: #08080A; font-family: 'Rooftop', system-ui, sans-serif; -webkit-font-smoothing: antialiased; }
a { color: inherit; }
a:hover { color: #02FFE0; }
img { max-width: 100%; }
body::before {
  content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px);
  z-index: 60; background: var(--ground); pointer-events: none;
}
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }
html { scroll-behavior: smooth; }
/* Каждая секция — минимум экран. Переключение секций — скрипт
   «переключение секций» в конце файла. */
#top, .u > section { box-sizing: border-box; }
@media (prefers-reduced-motion: reduce) {
  html { scroll-behavior: auto; }
  * { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
.board, .u > section { scroll-margin-top: 0; }
#topnav {
  position: fixed; top: calc(env(safe-area-inset-top, 0px) + 12px); left: 12px; right: 12px; z-index: 50;
  display: flex; align-items: center; gap: 16px;
  max-width: 1240px; margin: 0 auto;
  padding: 10px clamp(14px, 2vw, 22px);
  border-radius: 999px;
  background: transparent;
  backdrop-filter: none; -webkit-backdrop-filter: none;
  transition: background .28s ease, backdrop-filter .28s ease;
}
#topnav.stuck {
  background: rgba(14, 14, 18, 0.6);
  backdrop-filter: blur(22px) saturate(1.4); -webkit-backdrop-filter: blur(22px) saturate(1.4);
}
#topnav .brand {
  font-family: 'TT Travels Next', sans-serif; font-size: 15px; font-weight: 600;
  letter-spacing: -0.01em; text-decoration: none; color: #FFFFFF; white-space: nowrap; flex: 0 0 auto;
}
#topnav .brand { display: inline-flex; align-items: center; }
#topnav .brand .logo-mark { height: 1.6em; width: auto; flex: none; margin-right: 8px; }
#topnav .brand b { font-weight: 600; white-space: nowrap; }
#topnav .brand span { color: rgba(255, 255, 255, 0.5); font-weight: 500; margin-left: .35em; }
#topnav .links {
  display: flex; gap: clamp(8px, 1.2vw, 20px); font-size: 13px;
  overflow-x: auto; scrollbar-width: none; -ms-overflow-style: none;
  margin-left: auto; padding: 2px 0;
}
#topnav .links::-webkit-scrollbar { display: none; }
#topnav .links a {
  display: flex; gap: 5px; align-items: baseline; white-space: nowrap;
  text-decoration: none; color: rgba(255, 255, 255, 0.55); font-weight: 400;
  padding: 5px 10px; border-radius: 999px; transition: color .18s, background .18s;
}
#topnav .links a .n-num { font-variant-numeric: tabular-nums; opacity: .7; }
#topnav .links a:hover { color: #FFFFFF; background: rgba(255, 255, 255, 0.06); }
#topnav .links a.on { color: var(--ink-on-accent); background: var(--accent); font-weight: 600; }
#topnav .links a.on .n-num { opacity: .65; }
@media (max-width: 1080px) {
  #topnav .brand span { display: none; }
}
@media (max-width: 880px) {
  #topnav { gap: 10px; }
  #topnav .links a .n-ttl { display: none; }
  #topnav .links a .n-num { opacity: 1; }
}
#progress {
  position: fixed; left: 0; top: env(safe-area-inset-top, 0px); height: 2px; z-index: 61;
  background: var(--accent); width: 0;
}
#totop {
  position: fixed; z-index: 55;
  right: calc(clamp(16px, 2.5vw, 32px) + env(safe-area-inset-right, 0px));
  bottom: calc(clamp(16px, 2.5vw, 32px) + env(safe-area-inset-bottom, 0px));
  width: 44px; height: 44px; border: 0; border-radius: 999px; cursor: pointer;
  background: rgba(22, 22, 27, 0.9); color: #FFFFFF;
  backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
  display: none; align-items: center; justify-content: center;
}
#totop.show { display: flex; }
#totop:hover { background: var(--accent); color: var(--ink-on-accent); }
[data-dcclick] { cursor: pointer; }
/* ---------- интерактивные схемы (энергия, вода, разрез кузова) ---------- */
.sx { color: #FFFFFF; }
.sx button { font: inherit; border: 0; cursor: pointer; }
.sx-controls { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
.sx-tog {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 12px;
  border-radius: 999px; background: rgba(255, 255, 255, 0.07); color: rgba(255, 255, 255, 0.72);
  font-size: 14px; font-weight: 500; transition: background .2s, color .2s;
}
.sx-tog svg { flex: none; transition: color .2s; }
.sx-tog i { position: relative; flex: none; width: 30px; height: 18px; border-radius: 999px; background: rgba(255, 255, 255, 0.16); transition: background .2s; }
.sx-tog i::after { content: ""; position: absolute; top: 3px; left: 3px; width: 12px; height: 12px; border-radius: 999px; background: #FFFFFF; transition: transform .2s; }
.sx-tog[aria-pressed="true"] { background: rgba(2, 255, 224, 0.16); color: #FFFFFF; }
.sx-tog[aria-pressed="true"] svg { color: var(--accent); }
.sx-tog[aria-pressed="true"] i { background: var(--accent); }
.sx-tog[aria-pressed="true"] i::after { transform: translateX(12px); }
.sx-tog:disabled { opacity: .4; cursor: default; }
.sx-seg { display: inline-flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 4px; border-radius: 22px; background: rgba(255, 255, 255, 0.07); }
.sx-seg-l { display: inline-flex; align-items: center; gap: 6px; padding: 0 6px 0 8px; font-size: 14px; color: rgba(255, 255, 255, 0.6); }
.sx-seg button { min-height: 36px; padding: 0 14px; border-radius: 999px; background: transparent; color: rgba(255, 255, 255, 0.72); font-size: 14px; font-weight: 500; transition: background .2s, color .2s; }
.sx-seg button[aria-pressed="true"] { background: var(--accent); color: var(--ink-on-accent); }
.sx-seg button:disabled { opacity: .35; cursor: default; }
.sx-act { min-height: 44px; padding: 0 16px; border-radius: 999px; background: #FFFFFF; color: #0B0B0D; font-size: 14px; font-weight: 600; }
.sx-act[hidden] { display: none; }
.sx-board { padding: clamp(10px, 1.6vw, 22px); border-radius: 28px; background: #101014; }
.sx-stage { position: relative; width: 100%; }
.sx-stage > svg { position: absolute; inset: 0; display: block; width: 100%; height: 100%; overflow: visible; }
.sx-zone { fill: rgba(255, 255, 255, 0.028); }
.sx-zl { position: absolute; font-size: clamp(9px, 0.85vw, 12px); letter-spacing: .12em; text-transform: uppercase; color: rgba(255, 255, 255, 0.36); white-space: nowrap; pointer-events: none; }
.sx-wire { fill: none; stroke: #24242B; stroke-width: 12; stroke-linecap: round; stroke-linejoin: round; }
.sx-wire.k-data { stroke-width: 5; stroke-dasharray: 2 13.05; }
.sx-flow { fill: none; stroke-width: 9; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 0.1 30; opacity: 0; transition: opacity .35s; animation: sxflow 1s linear infinite; }
.sx-flow.on { opacity: 1; }
.sx-flow.rev { animation-direction: reverse; }
.sx-flow.k-pw, .sx-flow.k-hot { stroke: var(--accent); }
.sx-flow.k-cold { stroke: #FFFFFF; }
.sx-flow.k-grey { stroke: rgba(255, 255, 255, 0.4); animation-duration: 1.6s; }
.sx-flow.k-fuel { stroke: rgba(255, 255, 255, 0.55); stroke-width: 6; stroke-dasharray: 12 18.1; animation-duration: 2.2s; }
.sx-flow.k-data { stroke: rgba(255, 255, 255, 0.45); stroke-width: 5; stroke-dasharray: 0.1 14.95; animation-duration: 2.4s; }
@keyframes sxflow { to { stroke-dashoffset: -30.1; } }
.sx-node {
  position: absolute; transform: translate(-50%, -50%); width: max-content;
  display: flex; align-items: center; gap: clamp(6px, 0.8vw, 10px);
  padding: clamp(5px, 0.6vw, 8px) clamp(8px, 1vw, 14px) clamp(5px, 0.6vw, 8px) clamp(5px, 0.6vw, 8px);
  border-radius: clamp(12px, 1.2vw, 18px); background: #1E1E23; color: #FFFFFF; text-align: left;
  transition: background .2s, color .2s, opacity .3s;
}
.sx-node.big { padding: clamp(8px, 1vw, 14px); }
.sx-node:hover { background: #2A2A31; }
.sx-ic {
  flex: none; display: inline-flex; align-items: center; justify-content: center;
  width: clamp(26px, 2.6vw, 40px); height: clamp(26px, 2.6vw, 40px); border-radius: 999px;
  background: rgba(255, 255, 255, 0.08); color: rgba(255, 255, 255, 0.55); transition: background .25s, color .25s;
}
.sx-node.big .sx-ic { width: clamp(32px, 3.2vw, 48px); height: clamp(32px, 3.2vw, 48px); }
.sx-ic svg { width: 55%; height: 55%; }
.sx-tx { display: flex; flex-direction: column; min-width: 0; }
.sx-tx b { font-size: clamp(11px, 1vw, 15px); font-weight: 600; line-height: 1.2; }
.sx-tx small { margin-top: 2px; font-size: clamp(9.5px, 0.82vw, 12.5px); line-height: 1.25; color: rgba(255, 255, 255, 0.55); }
.sx-node[data-state="on"] .sx-ic { background: var(--accent); color: var(--ink-on-accent); }
.sx-node[data-state="open"] .sx-ic { background: transparent; color: var(--accent); }
.sx-node[data-state="off"] { opacity: .5; }
.sx-node[aria-pressed="true"] { background: #FFFFFF; color: #0B0B0D; opacity: 1; }
.sx-node[aria-pressed="true"] small { color: rgba(11, 11, 13, 0.6); }
.sx-node[aria-pressed="true"] .sx-ic { box-sizing: border-box; }
.sx-gauge { position: relative; flex: none; width: clamp(12px, 1.3vw, 18px); height: clamp(30px, 3.4vw, 50px); border-radius: 6px; background: rgba(255, 255, 255, 0.1); overflow: hidden; }
.sx-gauge span {
  position: absolute; left: 0; right: 0; bottom: 0; height: 0; background-color: var(--accent);
  background-image: repeating-linear-gradient(0deg, transparent 0 9px, rgba(0, 0, 0, 0.28) 9px 12px);
  background-size: 100% 12px; transition: height .25s linear;
  animation: sxgauge .8s linear infinite; animation-play-state: paused;
}
.sx-gauge[data-dir="up"] span { animation-play-state: running; }
.sx-gauge[data-dir="down"] span { animation-play-state: running; animation-direction: reverse; }
.sx-node[data-node="fresh"] .sx-gauge span { background-color: #E9EDF2; }
.sx-node[data-node="grey"] .sx-gauge span { background-color: rgba(255, 255, 255, 0.42); }
@keyframes sxgauge { to { background-position: 0 -12px; } }
.sx-status { margin: 14px 0 0; min-height: 3.1em; max-width: 84ch; font-size: 15px; line-height: 1.55; color: rgba(255, 255, 255, 0.72); }
.sx-info { margin-top: 12px; padding: clamp(18px, 2.4vw, 26px); border-radius: 20px; background: #15151A; }
.sx-info-t { margin: 0; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--accent); }
.sx-info-d { margin: 10px 0 0; max-width: 72ch; font-size: 16px; line-height: 1.6; color: rgba(255, 255, 255, 0.78); }

/* разрез кузова */
.sxb-wrap { display: flex; flex-wrap: wrap; gap: clamp(20px, 2.4vw, 40px); }
.sxb-pic { flex: 7 1 420px; min-width: 0; padding: clamp(16px, 2vw, 28px); border-radius: 32px; background: #15151A; }
.sxb-pic > svg { display: block; width: 100%; height: auto; }
.sx-cap { margin: 0 0 10px; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: rgba(255, 255, 255, 0.42); }
.sxb-tools { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 14px; }
.sxb-side { flex: 5 1 300px; min-width: 0; display: flex; flex-direction: column; gap: 8px; }
.sxb-list { display: flex; flex-direction: column; gap: 8px; }
.sxb-list button { display: flex; align-items: center; gap: 12px; min-height: 52px; padding: 0 16px; border-radius: 14px; background: #16161B; color: #FFFFFF; font-size: 15px; font-weight: 500; text-align: left; transition: background .2s, color .2s; }
.sxb-list button span { flex: none; width: 24px; font-family: 'TT Travels Next', sans-serif; font-size: 13px; font-weight: 600; opacity: .6; font-variant-numeric: tabular-nums; }
.sxb-list button:hover { background: #222229; }
.sxb-list button[aria-pressed="true"] { background: var(--accent); color: var(--ink-on-accent); }
.sxb .sx-info { margin-top: 4px; }
.sxb-items { margin: 12px 0 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 8px; }
.sxb-items li { position: relative; padding-left: 16px; font-size: 15px; line-height: 1.5; color: rgba(255, 255, 255, 0.78); }
.sxb-items li::before { content: ""; position: absolute; left: 0; top: .6em; width: 6px; height: 6px; border-radius: 999px; background: var(--accent); }
.sxb .sx-status { margin-top: 6px; min-height: 0; font-size: 14px; color: rgba(255, 255, 255, 0.6); }
.sxb .b-ground { fill: rgba(255, 255, 255, 0.08); }
.sxb .b-wheels rect { fill: #1E1E23; }
.sxb .b-skin { fill: none; stroke: #6E6E7B; stroke-width: 8; transition: stroke .3s; }
.sxb .b-steelfloor, .sxb .b-rib { fill: #6E6E7B; transition: fill .3s; }
.sxb .b-ins { fill: none; stroke: url(#sxHatch); stroke-width: 28; }
.sxb .b-clad { fill: none; stroke: #8C8C98; stroke-width: 8; transition: stroke .3s; }
.sxb .b-floorins { fill: url(#sxFloorHatch); }
.sxb .b-floortop { fill: #5A5A65; transition: fill .3s; }
.sxb .b-furn { fill: #D4D4D9; transition: fill .3s; }
.sxb .b-top { fill: #B7B7BE; transition: fill .3s; }
.sxb .b-cush { fill: #3A3A43; transition: fill .3s; }
.sxb .b-frame { fill: none; stroke: #A3A9B1; stroke-width: 6; transition: stroke .3s; }
.sxb .b-prof { fill: #A3A9B1; transition: fill .3s; }
.sxb .b-slot { fill: #15151A; }
.sxb .b-light { stroke: #FFD8A6; stroke-width: 4; stroke-linecap: round; }
.sxb .b-tag { fill: rgba(255, 255, 255, 0.38); font-size: 15px; letter-spacing: .14em; text-transform: uppercase; font-family: 'Rooftop', sans-serif; }
.sxb .b-ly { cursor: pointer; transition: opacity .45s ease, transform .6s cubic-bezier(.2, .7, .2, 1); }
.sxb .b-ly[data-vis="next"] { opacity: 0; transform: translateY(-28px); pointer-events: none; }
.sxb .b-ly[data-vis="gone"] { opacity: 0; transform: translateY(-140px); pointer-events: none; }
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-skin,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-clad,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-frame { stroke: var(--accent); }
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-steelfloor,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-rib,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-furn,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-top,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-cush,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-prof,
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-floortop { fill: var(--accent); }
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-ins { stroke: url(#sxHatchAcc); }
.sxb[data-apart="0"] .b-ly[data-vis="cur"] .b-floorins { fill: url(#sxFloorHatchAcc); }
.sxb .b-bridges { opacity: 0; pointer-events: none; transition: opacity .3s; }
.sxb[data-wet="1"] .b-bridges { opacity: 1; }
.sxb[data-wet="1"] .b-ly .b-rib, .sxb[data-wet="1"][data-apart="0"] .b-ly[data-vis="cur"] .b-rib { fill: #FFFFFF; }
.sxb .b-drop { fill: #FFFFFF; animation: sxdrop 1.6s ease-in infinite; }
@keyframes sxdrop { 0% { transform: translateY(0); opacity: 0; } 25% { opacity: 1; } 100% { transform: translateY(28px); opacity: 0; } }
@media (prefers-reduced-motion: reduce) {
  .sx-flow, .sx-gauge span, .sxb .b-drop { animation: none !important; }
}
/* общие чипы схем */
.sx-chip {
  display: inline-flex; align-items: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 999px;
  background: rgba(255, 255, 255, 0.07); color: #FFFFFF; font-size: 14px; font-weight: 500; transition: background .2s, color .2s;
}
.sx-chip b { font-family: 'TT Travels Next', sans-serif; font-size: 12px; opacity: .6; font-variant-numeric: tabular-nums; }
.sx-chip:hover { background: rgba(255, 255, 255, 0.12); }
.sx-chip[aria-pressed="true"] { background: var(--accent); color: var(--ink-on-accent); }
.sx-board > svg { display: block; width: 100%; height: auto; }
.sxm .sxm-svg { max-height: 62vh; }
.sx-board > .sx-cap { margin: 2px 4px 10px; }

/* хранение */
.sxs .s-ground { fill: rgba(255, 255, 255, 0.08); }
.sxs .s-body { fill: #1B1B21; }
.sxs .s-glass { fill: #26262E; }
.sxs .s-cab { fill: #202027; }
.sxs .s-door { fill: none; stroke: rgba(255, 255, 255, 0.12); stroke-width: 2; stroke-dasharray: 8 8; }
.sxs .s-bed { fill: #34343D; }
.sxs .s-top { fill: #3A3A44; }
.sxs .s-tag, .sxs .s-zl { fill: rgba(255, 255, 255, 0.34); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; font-family: 'Rooftop', sans-serif; pointer-events: none; }
.sxs .s-zone { cursor: pointer; outline: none; }

      { id: 'ac', icon: 'ac', t: 'Кондиционер', s: 'до 1,5 кВт', d: 'Независимый от машины моноблок от спецтехники до 1,5 кВт, 12/220 В, с поддержанием заданной температуры.',
        tiles: [['Кондиционер', 'держит заданную температуру', 'temp'], ['Питание', '12 / 220 В', 'on']] },
      { id: 'light', icon: 'light', t: 'Свет', s: 'тёплый, с диммером', d: 'Тёплые линейные LED в потолке и под шкафами, с диммированием.',
        tiles: [['Потолок', 'линейный LED', 'dim'], ['Под шкафами', 'линейный LED', 'dim']] },
      { id: 'vent', icon: 'fan', t: 'Вентиляция', s: 'люки с вентиляторами', d: 'Люки с вентиляторами в салоне и санузле.',
        tiles: [['Люк в салоне', 'вентилятор', 'tog'], ['Люк в санузле', 'вентилятор', 'tog']] },
      { id: 'phone', icon: 'phone', t: 'Телефон', s: 'всё то же в кармане', d: 'Все параметры дома дублируются в приложении на телефоне.',
        tiles: [['Дашборд', 'все параметры в телефоне', 'on']] }
    ];
    var APP_ASK = [
      ['Прогрей салон к утру', ['heat'], 'Запущу отопитель заранее — к утру в салоне будет тепло.'],
      ['Хватит заряда до завтра?', ['energy'], 'Сверю заряд аккумуляторов с тем, сколько дом тратит, и скажу, нужна ли подзарядка.'],
      ['Сколько осталось воды?', ['water'], 'Покажу уровень чистой и серой воды и подскажу, когда пора долить или слить.'],
      ['Режим сна', ['light', 'vent', 'heat'], 'Приглушу свет, оставлю вентиляцию и поддержу тепло до утра.'],
      ['Уезжаем', ['energy', 'water', 'light'], 'Проверю заряд и воду, выключу свет — можно ехать.']
    ];
    var APP = {
      initial: function () { return { sel: 'home', ask: -1, dim: [70, 40], on: {}, temp: { heat: 21, ac: 22 } }; },
      mount: function (root, st) {
        root.classList.add('sx', 'sxa');
        var n = APP_SYS.length, R = 38;
        var spokes = '', nodes = '';
        APP_SYS.forEach(function (s, i) {
          var a = -Math.PI / 2 + i * 2 * Math.PI / n;
          var x = 50 + R * Math.cos(a), y = 50 + R * Math.sin(a);
          spokes += '<line class="a-wire" x1="50" y1="50" x2="' + x.toFixed(2) + '" y2="' + y.toFixed(2) + '"/>' +
            '<line class="a-flow" data-sp="' + s.id + '" x1="50" y1="50" x2="' + x.toFixed(2) + '" y2="' + y.toFixed(2) + '"/>';
          nodes += '<button type="button" class="a-node" data-k="sys" data-v="' + s.id + '" style="left:' + x.toFixed(2) + '%;top:' + y.toFixed(2) + '%"><span class="sx-ic">' + ic(s.icon, 22) + '</span><b>' + esc(s.t) + '</b></button>';
        });
        root.innerHTML =
          '<div class="sxa-row">' +
            '<div class="sxa-hub"><svg viewBox="0 0 100 100" aria-hidden="true"><circle class="a-orbit" cx="50" cy="50" r="' + R + '"/>' + spokes + '</svg>' + nodes +
              '<button type="button" class="a-core" data-k="sys" data-v="home" aria-label="Главный экран"><span class="a-tab"><i><img src="assets/img/ipad-interface-v3.webp" alt="Главный экран автодома"></i></span><b>iPad Air 13″</b><small>на торпеде</small></button>' +
            '</div>' +
            '<div class="sxa-right">' +
              '<div class="a-ipad"><div class="a-screen"><div class="a-bar"><span class="a-brand"><svg class="a-logo" viewBox="0 0 64 64" fill="none" aria-hidden="true"><g transform="translate(32 32) rotate(45) scale(.74) translate(-32 -32)"><path d="M12 4H21Q29 4 29 12V21.42A11 11 0 0 0 21.42 29H12Q4 29 4 21V12Q4 4 12 4Z" fill="currentColor" transform="rotate(0 32 32)"/><path d="M12 4H21Q29 4 29 12V21.42A11 11 0 0 0 21.42 29H12Q4 29 4 21V12Q4 4 12 4Z" fill="currentColor" transform="rotate(90 32 32)"/><path d="M12 4H21Q29 4 29 12V21.42A11 11 0 0 0 21.42 29H12Q4 29 4 21V12Q4 4 12 4Z" fill="currentColor" transform="rotate(180 32 32)"/><path d="M12 4H21Q29 4 29 12V21.42A11 11 0 0 0 21.42 29H12Q4 29 4 21V12Q4 4 12 4Z" fill="currentColor" transform="rotate(270 32 32)"/></g><circle cx="32" cy="32" r="5" fill="var(--logo-accent, #02FFE0)"/></svg>Sprinter 4×4</span><button type="button" data-k="sys" data-v="home">Дом</button></div><div class="a-body"></div></div></div>' +
              '<p class="sx-cap a-note">Концепт интерфейса. Нажмите на виджет или систему; значения приведены для примера.</p>' +
            '</div>' +
          '</div>' +
          '<div class="sx-info a-ai"><p class="sx-info-t">' + ic('sparkle', 16) + ' ИИ-ассистент · идея</p>' +
            '<p class="sx-info-d">Можно не искать кнопку, а попросить голосом или текстом. Примеры — условные, чтобы показать идею:</p>' +
            '<div class="a-asks">' + APP_ASK.map(function (q, i) { return '<button type="button" class="sx-chip" data-k="ask" data-v="' + i + '">«' + esc(q[0]) + '»</button>'; }).join('') + '</div>' +
          '</div>';
        var body = root.querySelector('.a-body');
        function sys(id) { for (var i = 0; i < APP_SYS.length; i++) if (APP_SYS[i].id === id) return APP_SYS[i]; return null; }
        function tile(s, t, k) {
          var key = s.id + ':' + k, on = st.on[key] !== false, ctl = '';
          if (t[2] === 'tog') ctl = '<button type="button" class="a-sw" data-k="tog" data-v="' + key + '" aria-pressed="' + on + '"><i></i></button>';
          if (t[2] === 'on') ctl = '<span class="a-dot"></span>';
          if (t[2] === 'gauge') ctl = '<span class="a-bar2"><span style="width:' + (k === 1 && s.id === 'water' ? 30 : 72) + '%"></span></span>';
          if (t[2] === 'dim') ctl = '<input type="range" min="0" max="100" value="' + st.dim[k] + '" data-dim="' + k + '" aria-label="Яркость: ' + esc(t[0]) + '">';
          if (t[2] === 'temp') ctl = '<span class="a-temp"><button type="button" data-k="temp" data-v="' + s.id + ':-1" aria-label="Холоднее">−</button><b>' + st.temp[s.id] + '°</b><button type="button" data-k="temp" data-v="' + s.id + ':1" aria-label="Теплее">+</button></span>';
          return '<div class="a-tile' + (t[2] === 'dim' ? ' a-glow' : '') + '" style="' + (t[2] === 'dim' ? '--g:' + st.dim[k] / 100 : '') + '"><p><b>' + esc(t[0]) + '</b><small>' + esc(t[1]) + '</small></p>' + ctl + '</div>';
        }
        function render() {
          root.setAttribute('data-sel', st.sel);
          root.setAttribute('data-overview', st.sel === 'home' && st.ask < 0 ? 'true' : 'false');
          var lit = {};
          if (st.ask >= 0) APP_ASK[st.ask][1].forEach(function (id) { lit[id] = 1; });
          else if (st.sel !== 'home') lit[st.sel] = 1;
          root.querySelectorAll('.a-flow').forEach(function (f) { f.classList.toggle('on', !!lit[f.getAttribute('data-sp')]); });
          root.querySelectorAll('.a-node').forEach(function (b) {
            var id = b.getAttribute('data-v');
            b.setAttribute('aria-pressed', lit[id] ? 'true' : 'false');
          });
          root.querySelectorAll('[data-k="ask"]').forEach(function (b) { b.setAttribute('aria-pressed', +b.getAttribute('data-v') === st.ask ? 'true' : 'false'); });
          var h;
          if (st.ask >= 0) {
            var q = APP_ASK[st.ask];
            h = '<div class="a-chat"><p class="a-me">' + esc(q[0]) + '</p><p class="a-bot">' + ic('sparkle', 14) + ' ' + esc(q[2]) + '</p>' +
              '<div class="a-used">' + q[1].map(function (id) { var s = sys(id); return '<span>' + ic(s.icon, 14) + esc(s.t) + '</span>'; }).join('') + '</div></div>';
          } else if (st.sel === 'home') {
            var homeTargets = [
              ['sys', 'home', 'Обзор', 22.5, 3.4, 8, 5.5],
              ['sys', 'energy', 'Энергия', 31, 3.4, 9, 5.5],
              ['sys', 'water', 'Вода', 40.5, 3.4, 7, 5.5],
              ['sys', 'heat', 'Климат', 48, 3.4, 8.5, 5.5],
              ['sys', 'heat', 'Открыть управление климатом', 2, 62.5, 28.3, 34],
              ['sys', 'energy', 'Открыть управление энергией', 31.2, 62.5, 35.1, 34],
              ['sys', 'water', 'Открыть управление водой', 67.3, 46.5, 30.8, 21.7],
              ['sys', 'light', 'Открыть управление светом', 67.3, 69.2, 30.8, 19.5],
              ['ask', '3', 'Режим сна', 68, 88.5, 29, 6.5]
            ];
            h = '<div class="a-dashboard"><img src="assets/img/ipad-interface-v3.webp" alt="Главный экран Sprinter 4×4: салон, климат, энергия, вода и свет">' + homeTargets.map(function (t) {
              return '<button type="button" class="a-dashboard-hit" data-k="' + t[0] + '" data-v="' + t[1] + '" aria-label="' + esc(t[2]) + '" title="' + esc(t[2]) + '" style="left:' + t[3] + '%;top:' + t[4] + '%;width:' + t[5] + '%;height:' + t[6] + '%"></button>';
            }).join('') + '</div>';
          } else {
            var s = sys(st.sel);
            h = '<div class="a-sys"><p class="a-h">' + ic(s.icon, 20) + esc(s.t) + '</p><p class="a-d">' + esc(s.d) + '</p><div class="a-tiles">' +
              s.tiles.map(function (t, k) { return tile(s, t, k); }).join('') + '</div></div>';
          }
          body.innerHTML = h;
        }
        onClick(root, function (k, v) {
          if (k === 'sys') { st.sel = v; st.ask = -1; }
          else if (k === 'ask') { st.ask = st.ask === +v ? -1 : +v; }
          else if (k === 'tog') { st.on[v] = st.on[v] === false; }
          else if (k === 'temp') { var p = v.split(':'); st.temp[p[0]] = Math.max(16, Math.min(28, st.temp[p[0]] + +p[1])); }
          render();
        });
        root.addEventListener('input', function (e) {
          var k = e.target.getAttribute('data-dim');
          if (k == null) return;
          st.dim[+k] = +e.target.value;
          e.target.closest('.a-tile').style.setProperty('--g', st.dim[+k] / 100);
        });
        render();
      }
    };

    var SCHEMES = { energy: ENERGY, water: WATER, build: BUILD, storage: STORAGE, make: MAKE, joint: JOINT, builder: BUILDER, levels: LEVELS, cycle: CYCLE, app: APP };
    var STATE = {};
    function mount(el) {
      if (el.__sx) return;
      var name = el.getAttribute('data-scheme'), sp = SCHEMES[name];
      if (!sp) return;
      el.__sx = true;
      var st = STATE[name] || (STATE[name] = sp.initial());
      sp.mount(el, st, function () {});
    }
    function scan(node) {
      if (!node || node.nodeType !== 1) return;
      if (node.hasAttribute('data-scheme')) mount(node);
      var list = node.querySelectorAll('[data-scheme]');
      for (var i = 0; i < list.length; i++) mount(list[i]);
    }
    scan(document.body);
    new MutationObserver(function (ms) {
      ms.forEach(function (m) { for (var i = 0; i < m.addedNodes.length; i++) scan(m.addedNodes[i]); });
    }).observe(document.body, { childList: true, subtree: true });
  })();
})();
</script>

</body>
</html>
